title: Page
tabs:
  content:
    display: 'Contenu'
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Titre de la page'
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: 'Contenu'
          -
            handle: template
            field:
              type: template
              display: 'Template'
  seo:
    display: 'SEO'
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Titre meta'
              instructions: 'Laissez vide pour utiliser le titre de la page'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Description meta'
              instructions: 'Description pour les moteurs de recherche (max ~160 caractères)'
